<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Vibe - Interactive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .snap-x::-webkit-scrollbar { display: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .liked { color: #ef4444; transform: scale(1.2); transition: all 0.2s; }
    </style>
</head>
<body class="bg-black text-white font-sans antialiased">

    <main class="max-w-md mx-auto min-h-screen border-x border-gray-800 flex flex-col relative bg-[#050505]">
        
        <header class="p-4 flex justify-between items-center sticky top-0 z-50 bg-black/80 backdrop-blur-md border-b border-gray-900">
            <h1 class="text-xl font-black tracking-tighter italic">VIBE.css</h1>
            <button class="bg-white text-black px-5 py-1 rounded-full text-xs font-bold uppercase tracking-wider">Follow</button>
        </header>

        <section class="relative aspect-[4/5] w-full overflow-hidden">
            <div class="flex overflow-x-auto snap-x snap-mandatory h-full scroll-smooth no-scrollbar">
                <div class="min-w-full h-full snap-center"><img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=800" class="object-cover h-full w-full"></div>
                <div class="min-w-full h-full snap-center"><img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=800" class="object-cover h-full w-full"></div>
            </div>
        </section>

        <section class="p-4 flex flex-col gap-4">
            <div class="flex justify-between items-center">
                <div class="flex space-x-5 text-2xl">
                    <button id="likeBtn" onclick="toggleLike()">🤍</button>
                    <button onclick="document.getElementById('commentInput').focus()">💬</button>
                    <button>✈️</button>
                </div>
                <button class="text-2xl">🔖</button>
            </div>

            <div class="flex gap-2" id="reactionContainer">
                <button onclick="react('🔥')" class="bg-gray-900 hover:bg-gray-800 px-3 py-1 rounded-full text-sm border border-gray-800">🔥 <span id="count-🔥">0</span></button>
                <button onclick="react('🙌')" class="bg-gray-900 hover:bg-gray-800 px-3 py-1 rounded-full text-sm border border-gray-800">🙌 <span id="count-🙌">0</span></button>
                <button onclick="react('✨')" class="bg-gray-900 hover:bg-gray-800 px-3 py-1 rounded-full text-sm border border-gray-800">✨ <span id="count-✨">0</span></button>
            </div>
        </section>

        <section class="px-4 py-2 border-t border-gray-900 mt-2">
            <p class="text-sm mb-4"><span class="font-bold">VIBE.css</span> The 2026 Drop is live. ⚡️</p>
            
            <div id="commentList" class="space-y-3 mb-6 max-h-48 overflow-y-auto no-scrollbar">
                </div>

            <div class="flex gap-2 items-center bg-gray-900 rounded-full px-4 py-1 border border-gray-800">
                <input id="commentInput" type="text" placeholder="Add a comment..." class="bg-transparent text-sm w-full focus:outline-none py-2">
                <button onclick="addComment()" class="text-blue-400 font-bold text-sm">Post</button>
            </div>
        </section>

        <footer class="p-4 mt-auto">
            <button class="w-full bg-indigo-600 py-4 rounded-2xl font-bold text-sm tracking-widest active:scale-95 transition-transform">SHOP NOW</button>
        </footer>
    </main>

    <script>
        // --- Initialization ---
        let likes = JSON.parse(localStorage.getItem('vibe_likes')) || false;
        let reactions = JSON.parse(localStorage.getItem('vibe_reactions')) || {'🔥': 0, '🙌': 0, '✨': 0};
        let comments = JSON.parse(localStorage.getItem('vibe_comments')) || [
            {user: 'SirJe', text: ' Magandang Kagamitan sa Pagtuturo at Pag-aaral. Napakahusay!!!'}
        ];

        function init() {
            renderLikes();
            renderReactions();
            renderComments();
        }

        // --- Like Logic ---
        function toggleLike() {
            likes = !likes;
            localStorage.setItem('vibe_likes', JSON.stringify(likes));
            renderLikes();
        }

        function renderLikes() {
            const btn = document.getElementById('likeBtn');
            btn.innerHTML = likes ? '❤️' : '🤍';
            btn.className = likes ? 'liked text-2xl' : 'text-2xl';
        }

        // --- Reaction Logic ---
        function react(emoji) {
            reactions[emoji]++;
            localStorage.setItem('vibe_reactions', JSON.stringify(reactions));
            renderReactions();
        }

        function renderReactions() {
            for (const emoji in reactions) {
                const el = document.getElementById(`count-${emoji}`);
                if (el) el.innerText = reactions[emoji];
            }
        }

        // --- Comment Logic ---
        function addComment() {
            const input = document.getElementById('commentInput');
            if (!input.value.trim()) return;

            comments.push({ user: 'you', text: input.value });
            localStorage.setItem('vibe_comments', JSON.stringify(comments));
            input.value = '';
            renderComments();
        }

        function renderComments() {
            const container = document.getElementById('commentList');
            container.innerHTML = comments.map(c => `
                <div class="text-sm">
                    <span class="font-bold mr-2">${c.user}</span>
                    <span class="text-gray-300">${c.text}</span>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        init();
    </script>
</body>
</html>
